[package]
name = "agentscope-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A community-driven Rust implementation inspired by AgentScope"
license = "Apache-2.0"
readme = "README.md"
keywords = ["agent", "ai", "llm", "agentscope"]
categories = ["asynchronous"]
publish = false

[lib]
name = "agentscope"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
