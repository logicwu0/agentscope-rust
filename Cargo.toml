[package]
name = "agentscope-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A community-driven Rust implementation inspired by AgentScope"
license = "Apache-2.0"
readme = "README.md"
keywords = ["agent", "ai", "llm", "agentscope"]
categories = ["asynchronous"]
publish = false

[lib]
name = "agentscope"
path = "src/lib.rs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
