[package]
name = "agentscope-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
agentscope-rust = { path = "../.." }
agentscope-state-sqlite = { path = "../../plugins/agentscope-state-sqlite" }
agentscope-idempotency-sqlite = { path = "../../plugins/agentscope-idempotency-sqlite" }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
