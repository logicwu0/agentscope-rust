[package]
name = "agentscope-offload-file"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Local file tool-result offload storage for AgentScope Rust"
publish = false

[dependencies]
agentscope-rust = { path = "../.." }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
