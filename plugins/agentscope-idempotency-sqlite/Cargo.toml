[package]
name = "agentscope-idempotency-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Durable SQLite idempotency records for AgentScope Rust tools"
publish = false

[dependencies]
agentscope-rust = { path = "../.." }
serde_json = "1"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
agentscope-state-sqlite = { path = "../agentscope-state-sqlite" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
