[package]
name = "agentscope-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Opt-in MCP stdio tool client for AgentScope Rust"
publish = false

[dependencies]
agentscope-rust = { path = "../.." }
serde_json = "1"
jsonschema = { version = "0.50", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
agentscope-offload-file = { path = "../agentscope-offload-file" }
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
